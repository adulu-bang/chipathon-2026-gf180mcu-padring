# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "RO Based True Random Number Generator With BIST"   
  team: "A53 IRIS Labs Hardware"       
  discord: ""       
  description: "True Random Number Generator with custom ring oscillator using current starved inverters"
  lvs_config: "lvs_config.json"
  gf_def_ready: true            # data ready for def generation with global foundries' pad frame
  ws_def_ready: true            # data ready for def generation with wafer space pad frame
  drc_ready: true               # data ready for integration and DRC
  lvs_ready: true               # data ready for integrated LVS
  export_control: "docs/Export_Control_GF_Rev8.2.docx" 

# ======================================================
# Pin Configuration
# ======================================================
pins: 
  - name: GND
    io_type: ground
    
  - name: rst_n
    io_type: input_cmos

  - name: clk 
    io_type: input_cmos

  - name: test_data_in
    io_type: input_cmos
    
  - name: test_mode_en
    io_type: input_cmos

  - name: data_serial_out
    io_type: bidirectional

  - name: bist_flag_out
    io_type: bidirectional

  - name: vin_vco
    io_type: analog
    secondary_esd: false

  - name: analog_raw_out
    io_type: analog
    secondary_esd: false

  - name: VDD
    io_type: power